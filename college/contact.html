
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Fest - Registration</title>
    <link rel="stylesheet" href="venue.css">
</head>
<body>
    <header>
        <h1>Fest Registration</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section>
        <h2>Register Now</h2>
        <form action="register.html" method="get">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option>CSM</option>
                <option>CSE</option>
                <option>AIML</option>
                <option>ECE</option>
                <option>EEE</option>
            </select>

            <label for="event">Choose Event:</label>
            <select id="event" name="event" required>
                <option value="">Select Event</option>
                <option>Technical Events</option>
                <option>Cultural Events</option>
                <option>Gaming</option>
                <option>Talent Show</option>
            </select>

            <button type="submit">Submit Registration</button>
        </form>
        <p><a href="events.html">Back to Events</a></p>
    </section>

    <footer>
        <p>&copy; 2026 College Fest</p>
    </footer>
</body>
</html>
